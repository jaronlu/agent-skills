version = 1

# Skills are authored in this repository and linked into shared user skill
# directories. Targets reference a profile instead of repeating skill lists.
#
# A root profile declares both sets:
# - `skills`   installed by the manager
# - `excluded` deliberately not installed; manager-owned entries are removed
#
# `distribution.unlisted = "excluded"` makes `excluded` optional: skills a
# profile does not name are excluded automatically. `sync` treats the resolved
# `skills` set as an allowlist and prunes managed entries no longer listed.
#
# A profile with `extends` inherits both sets from its parent:
# - `skills`   promotes inherited excluded entries to installed
# - `excluded` demotes inherited installed entries to excluded
#
# Every target's resolved `skills` + `excluded` must cover all repository skills
# so no skill can go silently missing. Entries the manager does not own, including
# third-party skills, are left untouched.
#
# `source` is omitted on purpose: it defaults to this repository, so moving the
# checkout can no longer leave a stale path behind.

[distribution]
# Global rule: skills a profile does not name are excluded. A profile only
# lists what it installs; `excluded` is for demoting inherited skills.
unlisted = "excluded"

[profiles.core]
skills = [
  "agent-gitignore",
  "chinese-text-fixer",
  "first-principles",
  "git-commit",
  "human-readable-codebook",
  "prompt-optimizer",
  "what-why-how",
]
excluded = [
  "chrome-bookmarks",
  "communication-formulas",
  "design-convergence-review",
  "five-dimension-analysis",
  "llm-wiki",
]

[profiles.full]
extends = "core"
# Promote the three skills that `full` installs but `core` does not.
skills = [
  "communication-formulas",
  "design-convergence-review",
  "llm-wiki",
]

[profiles.wiki]
# The local ~/llm-wiki checkout installs only this skill. Unlisted skills are
# excluded by the [distribution] rule above.
skills = [
  "llm-wiki",
]

[targets.agents]
path = "~/.agents/skills"
profile = "full"

[targets.workbuddy]
# WorkBuddy user-level skills, symlinked like every other target.
path = "~/.workbuddy/skills"
profile = "core"

[targets.zcode]
# Symlink target; the pre-existing link chained through ~/.agents/skills and is
# rewritten to point at this repository directly so `check` can detect drift.
path = "~/.zcode/skills"
profile = "core"

[targets.claude]
# Claude Code only reads ~/.claude/skills (plus project/plugin dirs); it has no
# native support for ~/.agents/skills. Managed here like zcode: repo skills are
# symlinked directly so `check` can detect drift.
path = "~/.claude/skills"
profile = "full"

[targets.wiki]
# Project-level Claude skills for the local wiki checkout. The link is
# machine-specific; that repository ignores .claude/skills locally.
path = "~/llm-wiki/.claude/skills"
profile = "wiki"
