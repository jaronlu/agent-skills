<svg viewBox="0 0 680 600" width="680" height="600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>五维分析的六步执行流程</title>
<desc>从待分析的局面出发，依次经过事实层、五维扫描（史经政军哲）、冲突裁决、反证信号、动作清单，最后 30 天回看校准。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="600" fill="#FFFFFF"/>

<rect x="240" y="20" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">待分析的局面</text>
<path d="M340 64 L340 80" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="82" width="600" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="99" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Step 0 · 事实层：先写事实，不下判断</text>
<text x="60" y="116" dominant-baseline="central" font-size="12" fill="#5F5E5A">只列可验证信息，逐条标注 [事实] / [转述] / [未知]；无证据即写未知</text>
<path d="M340 130 L340 146" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="148" width="600" height="92" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="60" y="166" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Step 1 · 五维扫描（每维三栏：证据 / 推断 / 空白）</text>

<rect x="53" y="182" width="107" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="106" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">史 · 时间线</text>
<text x="106" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">怎么走到今天</text>

<rect x="170" y="182" width="107" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="223" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">经 · 利益链</text>
<text x="223" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">谁的账本在动</text>

<rect x="287" y="182" width="107" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">政 · 权力图</text>
<text x="340" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">谁能真正拍板</text>

<rect x="404" y="182" width="107" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="457" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">军 · 博弈局</text>
<text x="457" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">各方筹码多少</text>

<rect x="521" y="182" width="107" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="574" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">哲 · 本质层</text>
<text x="574" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">转成可观察预测</text>

<path d="M340 240 L340 256" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="258" width="600" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="275" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Step 2 · 冲突裁决：维度打架时按规则定优先级</text>
<text x="60" y="292" dominant-baseline="central" font-size="12" fill="#5F5E5A">事实&gt;推断；短期看经、中期看政、长期看史；军是约束不是目标</text>
<path d="M340 306 L340 322" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="324" width="600" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="343" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Step 3 · 反证信号（最关键，不可省略）</text>
<text x="60" y="362" dominant-baseline="central" font-size="12" fill="#0C447C">如果 X 在 Y 之前发生，则判断 Z 为假。写不出反证信号 = 那是信念，不是分析</text>
<path d="M340 380 L340 396" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="398" width="600" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="415" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Step 4 · 动作清单（≤3 条）</text>
<text x="60" y="432" dominant-baseline="central" font-size="12" fill="#5F5E5A">每条具体到谁、做什么、何时、完成标准；「不出手」是合法选项</text>
<path d="M340 446 L340 462" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="464" width="600" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="481" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Step 5 · 回看校准（建议 30 天后）</text>
<text x="60" y="498" dominant-baseline="central" font-size="12" fill="#5F5E5A">记录哪维猜对、哪维猜错，据此调整各维权重</text>

<rect x="40" y="532" width="600" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="60" y="549" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">四道铁律：可证伪 · 可裁决 · 可操作 · 可校准</text>
<text x="60" y="568" dominant-baseline="central" font-size="12" fill="#5F5E5A">Step 0、Step 3、Step 5 不可省略——这三步是全部防自欺保险</text>
</svg>
