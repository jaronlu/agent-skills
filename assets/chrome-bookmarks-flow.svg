<svg viewBox="0 0 680 814" width="680" height="814" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>chrome-bookmarks 整理与写回流程</title>
<desc>从定位 Chrome 配置开始，检测进程、备份、把三个 root 一并归类、去冗余，仅在浏览器完全退出后写回；其他书签或移动设备书签非空时先确认，同步覆盖时停止并要求先清空云端。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="814" fill="#FFFFFF"/>

<rect x="190" y="20" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">收到书签整理请求</text>
<path d="M340 64 L340 80" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="82" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="100" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">① 定位配置</text>
<text x="60" y="120" dominant-baseline="central" font-size="12" fill="#5F5E5A">读 Local State 的 last_used，不要默认当成 Default</text>
<path d="M340 134 L340 150" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="152" width="600" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="170" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">② Chrome 是否仍在运行？</text>
<text x="60" y="190" dominant-baseline="central" font-size="12" fill="#854F0B">关窗口不够，必须完全退出；禁止 kill</text>
<path d="M340 204 L340 220" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="222" width="280" height="70" rx="8" fill="#FCE8E8" stroke="#A32D2D" stroke-width="0.5"/>
<text x="180" y="244" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#822727">在运行</text>
<text x="180" y="264" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">停止写回，要求 Cmd+Q</text>
<text x="180" y="280" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">可继续只做整理文件</text>

<rect x="360" y="222" width="280" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="500" y="244" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">已退出</text>
<text x="500" y="264" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">允许后续写回</text>
<text x="500" y="280" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">先产出整理 JSON</text>
<path d="M500 292 L500 308" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="310" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="328" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">③ 备份原始 Bookmarks</text>
<text x="60" y="348" dominant-baseline="central" font-size="12" fill="#5F5E5A">用户已有备份则不再复制一份</text>
<path d="M340 362 L340 378" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="380" width="600" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="398" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">④ 按分类树归类</text>
<text x="60" y="418" dominant-baseline="central" font-size="12" fill="#5F5E5A">用户自带分类树优先，否则套用 taxonomy.md 的模式</text>
<text x="60" y="436" dominant-baseline="central" font-size="12" fill="#5F5E5A">覆盖全部 roots：书签栏 / 其他书签 / 移动设备</text>
<path d="M340 450 L340 466" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="468" width="600" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="486" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑤ 去冗余</text>
<text x="60" y="506" dominant-baseline="central" font-size="12" fill="#5F5E5A">别处已有、低价值页、同站过多；工作文档不删</text>
<text x="60" y="524" dominant-baseline="central" font-size="12" fill="#5F5E5A">官方站与仓库根优先；上限按用户设定</text>
<path d="M340 538 L340 554" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="556" width="600" height="106" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="578" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">⑥ 写回前再检</text>
<text x="60" y="598" dominant-baseline="central" font-size="12" fill="#854F0B">进程已退出，且 prepared 含 roots.bookmark_bar</text>
<text x="60" y="616" dominant-baseline="central" font-size="12" fill="#854F0B">写回 Bookmarks，旧文件留在 Bookmarks.bak</text>
<text x="60" y="634" dominant-baseline="central" font-size="12" fill="#854F0B">其他书签/移动设备非空 → 清空前先确认，未确认不写回</text>
<text x="60" y="652" dominant-baseline="central" font-size="12" fill="#854F0B">同步会合并云端；云端未清空则停止并说明</text>
<path d="M340 662 L340 678" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="680" width="600" height="88" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="702" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">交付</text>
<text x="60" y="722" dominant-baseline="central" font-size="12" fill="#3B6D11">报告条数、第一层文件夹与 warning 行</text>
<text x="60" y="740" dominant-baseline="central" font-size="12" fill="#3B6D11">打开 Chrome 先核对栏上分类</text>
<text x="60" y="758" dominant-baseline="central" font-size="12" fill="#3B6D11">旧分类再现 = 云端未空，不要再盲写</text>
</svg>
