<svg viewBox="0 0 680 460" width="680" height="460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>五大沟通公式的选择路由</title>
<desc>按沟通目的选择表达公式：做决策用 SCQA，接受方案用 FAB，改变行为用 BACC，破冰用 3W，记住观点用 PREP。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="460" fill="#FFFFFF"/>

<rect x="230" y="20" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">这次要让对方做什么？</text>

<rect x="40" y="88" width="170" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="125" y="112" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">做决策 / 采纳建议</text>
<path d="M212 112 L251 112" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="255" y="88" width="385" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="275" y="104" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">SCQA · 汇报</text>
<text x="275" y="121" dominant-baseline="central" font-size="12" fill="#185FA5">情景 → 冲突 → 问题 → 答案（向上汇报默认答案前置）</text>

<rect x="40" y="148" width="170" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="125" y="172" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">接受方案 / 掏钱</text>
<path d="M212 172 L251 172" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="255" y="148" width="385" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="275" y="164" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">FAB · 说服</text>
<text x="275" y="181" dominant-baseline="central" font-size="12" fill="#185FA5">特征 → 优势 → 利益（B 必须是对方得到的）</text>

<rect x="40" y="208" width="170" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="125" y="232" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">改变行为 / 不翻脸</text>
<path d="M212 232 L251 232" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="255" y="208" width="385" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="275" y="224" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">BACC · 反馈</text>
<text x="275" y="241" dominant-baseline="central" font-size="12" fill="#185FA5">事实 → 感受 → 方案 → 后果（事实须摄像头能拍到）</text>

<rect x="40" y="268" width="170" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="125" y="292" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">愿意继续聊下去</text>
<path d="M212 292 L251 292" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="255" y="268" width="385" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="275" y="284" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">3W · 破冰</text>
<text x="275" y="301" dominant-baseline="central" font-size="12" fill="#185FA5">做什么 → 来自哪 → 为什么在这（自述 + 抛回钩子）</text>

<rect x="40" y="328" width="170" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="125" y="352" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">记住并引用观点</text>
<path d="M212 352 L251 352" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="255" y="328" width="385" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="275" y="344" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">PREP · 发言</text>
<text x="275" y="361" dominant-baseline="central" font-size="12" fill="#185FA5">观点 → 理由 → 例子 → 重申（结尾须升级，禁止复读）</text>

<rect x="40" y="396" width="600" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="418" dominant-baseline="central" font-size="13" fill="#633806">撞车时：改行为→BACC，决策→SCQA，掏钱→FAB，只记住→PREP，还不熟→3W。一次只用一套。</text>
</svg>
