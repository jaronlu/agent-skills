<svg viewBox="0 0 680 810" width="680" height="810" xmlns="http://www.w3.org/2000/svg" role="img">
<title>human-readable-codebook 的执行流程</title>
<desc>硬闸门判定 openwiki_begin 能否启动：不可用则阻断，不写独立章节。可用则按 Phase 1-8 推进，每个阶段前置读取对应 reference，⑤ 之后按证据状态分流，最终产出 OpenWiki 页面集。update 模式下 openwiki_begin 返回 noop 即报告无需更新并停止。</desc>
<defs>
<style>text{font-family:system-ui,-apple-system,sans-serif}</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth">
<path d="M0 1 L10 5 L0 9 z" fill="#888780"/>
</marker>
</defs>
<rect width="680" height="810" fill="#FFFFFF"/>

<rect x="190" y="20" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">把仓库讲成不用翻源码的书</text>
<path d="M340 64 L340 80" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="80" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="100" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">① 硬闸门 · openwiki_begin 必须成功返回</text>
<text x="60" y="120" dominant-baseline="central" font-size="12" fill="#5F5E5A">工具缺失、启动失败、未配置、用户要求跳过，都算不可用</text>
<path d="M340 132 L340 140 L185 140 L185 148" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 132 L340 140 L495 140 L495 148" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="148" width="290" height="56" rx="8" fill="#FCE8E8" stroke="#A32D2D" stroke-width="0.5"/>
<text x="185" y="170" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#822727">阻断：停止，不写独立页面</text>
<text x="185" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">中文说明缺什么、怎样解锁</text>

<rect x="350" y="148" width="290" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="495" y="170" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">继续：按返回模式进入</text>
<text x="495" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">init 首次生成 · update 增量</text>
<path d="M495 204 L495 212 L340 212 L340 220" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="220" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="240" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">② Phase 1-3 仓库发现 · 运行理解 · 场景追踪</text>
<text x="60" y="258" dominant-baseline="central" font-size="12" fill="#5F5E5A">references/repository-analysis.md；选出贯穿全书的 running example</text>
<path d="M340 276 L340 292" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="292" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="312" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">③ Phase 4-5 知识建模 · 概念依赖排章 · submit_plan</text>
<text x="60" y="330" dominant-baseline="central" font-size="12" fill="#5F5E5A">references/knowledge-engineering.md；不按目录、不按文件切章</text>
<path d="M340 348 L340 356 L185 356 L185 364" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 348 L340 356 L495 356 L495 364" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="364" width="290" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="185" y="388" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">≥5 章 → 计划含 summary 页</text>
<rect x="350" y="364" width="290" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="495" y="388" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">否则 → 不排 summary 页</text>
<path d="M185 412 L185 420 L340 420 L340 428" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495 412 L495 420 L340 420" fill="none" stroke="#888780" stroke-width="1.5"/>

<rect x="40" y="428" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="448" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">④ Phase 6 逐页写作：next_page → submit_page 循环</text>
<text x="60" y="466" dominant-baseline="central" font-size="12" fill="#5F5E5A">references/documentation-standards.md；每页给调用链与 SVG 图</text>
<path d="M340 484 L340 500" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="500" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="520" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑤ Phase 7 逐条 Claim 标 Verified / Inferred / Unverified</text>
<text x="60" y="538" dominant-baseline="central" font-size="12" fill="#5F5E5A">references/evidence-verification.md；73 项清单逐条过</text>
<path d="M340 556 L340 564 L185 564 L185 572" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 556 L340 564 L495 564 L495 572" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="572" width="290" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="185" y="596" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">仍有 Unverified → 披露限制</text>
<rect x="350" y="572" width="290" height="48" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="495" y="596" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">全部可验证 → finish 通过</text>
<path d="M185 620 L185 628 L340 628 L340 636" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495 620 L495 628 L340 628" fill="none" stroke="#888780" stroke-width="1.5"/>

<rect x="40" y="636" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="656" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑥ Phase 8 源码变更 · 受影响章节 · 四类分级只改该改的</text>
<text x="60" y="674" dominant-baseline="central" font-size="12" fill="#5F5E5A">references/knowledge-maintenance.md；无 claim 覆盖视为证据缺口</text>
<path d="M340 692 L340 708" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="708" width="600" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="728" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">出口 · OpenWiki 页面集（唯一交付形态）</text>
<text x="60" y="746" dominant-baseline="central" font-size="12" fill="#3B6D11">overview / quickstart / summary / 章节 / 术语表 / 未决问题</text>
</svg>
