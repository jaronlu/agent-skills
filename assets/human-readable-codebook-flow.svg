<svg viewBox="0 0 680 1028" width="680" height="1028" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>human-readable-codebook 的执行流程</title>
<desc>硬闸门判定 openwiki_begin 能否启动：不可用即阻断，不写任何页面，也不接受用户要求跳过。通过后按 status 与 mode 分流：noop 报告后停止，init 走 Phase 1-5 规划（Phase 1 先定版本基线，只覆盖官方推荐版本线，弃用版本与 API 不写）与 Phase 6-7 逐页循环，循环清空后由 openwiki_finish 终检。源码变更触发另一轮 mode=update，Phase 8 影响分析后提交受影响页计划（被取代版本页一并删除），再回页面循环按 Phase 7 复检，最后 finish 终检。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth">
<path d="M0 1 L10 5 L0 9 z" fill="#888780"/>
</marker>
</defs>
<rect width="680" height="1028" fill="#FFFFFF"/>

<rect x="40" y="20" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="40" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">入口 · 为陌生仓库写学习型书，或让既有书跟上源码变更</text>
<text x="60" y="62" dominant-baseline="central" font-size="12" fill="#5F5E5A">读者手上没有源码；交付物是 OpenWiki 页面，不是散落章节</text>
<path d="M340 72 V88" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="88" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="108" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">① 硬闸门 · openwiki_begin 必须成功返回</text>
<text x="60" y="128" dominant-baseline="central" font-size="12" fill="#5F5E5A">工具缺失、启动失败、未配置、用户要求跳过，都算不可用</text>
<path d="M340 144 V152 H185 V160" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 144 V152 H495 V160" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="160" width="290" height="56" rx="8" fill="#FCE8E8" stroke="#A32D2D" stroke-width="0.5"/>
<text x="185" y="182" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#822727">阻断 · 停止，不写任何页面</text>
<text x="185" y="202" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">中文说明缺什么、怎样解锁</text>

<rect x="350" y="160" width="290" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="495" y="182" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">② 通过 · 读 status 与 mode</text>
<text x="495" y="202" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">noop 已是最新 · init 建新书 · update 增量</text>
<path d="M495 216 V232 H185 V240" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495 216 V240" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="240" width="290" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="185" y="260" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">noop · 报告无需更新并停止</text>
<text x="185" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">不为未变更的书发明计划</text>

<rect x="350" y="240" width="290" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="495" y="260" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">init · 进入 ③ 规划</text>
<text x="495" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">references/repository-analysis.md</text>
<path d="M495 292 V300 H340 V316" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="316" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="336" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">③ Phase 1-3 仓库发现 · 运行理解 · 场景追踪</text>
<text x="60" y="356" dominant-baseline="central" font-size="12" fill="#5F5E5A">先定版本基线（弃用 API 不写）；running example 取当前版本线，其余场景作对照</text>
<path d="M340 372 V388" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="388" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="408" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">④ Phase 4-5 概念依赖排章 · openwiki_submit_plan</text>
<text x="60" y="428" dominant-baseline="central" font-size="12" fill="#5F5E5A">references/knowledge-engineering.md；不按目录或文件切章</text>
<path d="M340 444 V452 H185 V460" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 444 V452 H495 V460" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="460" width="290" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="185" y="482" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">≥5 章 → 加 openwiki/summary.md</text>
<text x="185" y="502" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">update 缺也补；排在队尾对着成稿写</text>

<rect x="350" y="460" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="495" y="482" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">init 计划必含 quickstart.md</text>
<text x="495" y="502" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">永不规划 index.md</text>
<path d="M185 516 V524 H340 V532" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495 516 V524 H340" fill="none" stroke="#888780" stroke-width="1.5"/>

<rect x="40" y="532" width="560" height="148" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="60" y="550" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑤ Phase 6-7 逐页循环：写一页，校验一页</text>
<text x="60" y="570" dominant-baseline="central" font-size="12" fill="#5F5E5A">队列还有页 → 回 Phase 6；队列空 → ⑥ finish</text>

<rect x="52" y="584" width="256" height="68" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="68" y="600" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Phase 6 · 写当前页</text>
<text x="68" y="620" dominant-baseline="central" font-size="12" fill="#185FA5">documentation-standards.md</text>
<text x="68" y="638" dominant-baseline="central" font-size="12" fill="#185FA5">调用链逐跳；SVG 图按需</text>

<rect x="324" y="584" width="264" height="68" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="600" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Phase 7 · 校验该页 Claim</text>
<text x="340" y="620" dominant-baseline="central" font-size="12" fill="#185FA5">evidence-verification.md</text>
<text x="340" y="638" dominant-baseline="central" font-size="12" fill="#185FA5">全套清单逐条过</text>

<path d="M308 618 H324" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M456 652 V666 H180 V652" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M588 618 H612 V704" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="704" width="600" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="724" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">⑥ openwiki_finish 终检：Claims 与页面都通过才交付</text>
<text x="60" y="744" dominant-baseline="central" font-size="12" fill="#854F0B">未通过 → 回 ⑤ 改页；不交付半成品</text>
<path d="M340 760 V776" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="776" width="600" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="796" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">出口 · OpenWiki 页面集（唯一交付形态）</text>
<text x="60" y="816" dominant-baseline="central" font-size="12" fill="#3B6D11">overview / quickstart / summary / 章节 / 术语表 / 未决问题</text>
<path d="M340 832 V848" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="352" y="844" dominant-baseline="central" font-size="12" fill="#5F5E5A">之后源码变更</text>

<rect x="40" y="848" width="600" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="868" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">⑦ 另一轮 · 源码变更后 openwiki_begin(mode=update)</text>
<text x="60" y="888" dominant-baseline="central" font-size="12" fill="#185FA5">mode=noop 同样报告后停止；不从 Phase 1 重跑全书</text>
<path d="M340 900 V916" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="916" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="936" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑧ Phase 8 影响分析 · 变更符号 → 受影响页面 → 四类分级</text>
<text x="60" y="956" dominant-baseline="central" font-size="12" fill="#5F5E5A">先 submit_plan 受影响页与删除项（含被取代版本页）；再回 ⑤ 复检 knowledge-maintenance.md</text>
<text x="60" y="974" dominant-baseline="central" font-size="12" fill="#5F5E5A">依据 Claim 的 stale / unresolved；无 claim 覆盖视为证据缺口</text>
<path d="M40 952 H24 V606 H40" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
