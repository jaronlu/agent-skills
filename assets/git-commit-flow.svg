<svg viewBox="0 0 680 900" width="680" height="900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>git-commit 的提交决策流程</title>
<desc>判定范围后产出 type(scope): subject。跨模块同一意图用 feat(common&amp;share&amp;tool) 加每模块一行正文。连接线箭头画在格子间隙里，避免被下一框盖住。</desc>
<defs>
<style>text{font-family:system-ui,-apple-system,sans-serif}</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth">
<path d="M0 1 L10 5 L0 9 z" fill="#888780"/>
</marker>
</defs>
<rect width="680" height="900" fill="#FFFFFF"/>

<rect x="190" y="20" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">收到提交请求</text>
<path d="M340 68 L340 84" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="92" width="600" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="114" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">① message 只出消息 · commit 创建原子提交</text>
<path d="M340 140 L340 156" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="164" width="600" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="182" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">② porcelain 定范围</text>
<text x="60" y="200" dominant-baseline="central" font-size="12" fill="#854F0B">有暂存且有未暂存/未跟踪 → 问 A/B；否则自动全选或仅暂存</text>
<path d="M340 220 L340 236" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="53" y="244" width="180" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="143" y="266" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">A · 只提交暂存</text>
<rect x="250" y="244" width="180" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="266" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">B · 提交全部</text>
<rect x="447" y="244" width="180" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="537" y="266" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">自动 · 全选 / 仅暂存</text>
<path d="M340 292 L340 308" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="316" width="600" height="44" rx="8" fill="#FCE8E8" stroke="#A32D2D" stroke-width="0.5"/>
<text x="60" y="338" dominant-baseline="central" font-size="14" font-weight="500" fill="#822727">③ 密钥 / 混意图 / 格式冲突；进行中 rebase 不提交</text>
<path d="M340 364 L340 380" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="388" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="406" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">④ 每组一条 type(scope): subject</text>
<text x="60" y="424" dominant-baseline="central" font-size="12" fill="#5F5E5A">feat / fix / docs / refactor / test / perf / style / chore</text>
<path d="M340 444 L340 460" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="468" width="600" height="412" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="60" y="488" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">使用后结果</text>

<rect x="53" y="506" width="574" height="128" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="73" y="524" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">Message mode · type(scope): subject</text>
<text x="73" y="546" dominant-baseline="central" font-size="12" fill="#3B6D11">feat(auth): add WeChat QR login</text>
<text x="73" y="564" dominant-baseline="central" font-size="12" fill="#3B6D11">fix(api): handle null user response</text>
<text x="73" y="582" dominant-baseline="central" font-size="12" fill="#3B6D11">docs: update authentication guide</text>
<text x="73" y="600" dominant-baseline="central" font-size="12" fill="#3B6D11">chore(deps): update axios security patch</text>
<text x="73" y="618" dominant-baseline="central" font-size="12" fill="#3B6D11">feat(api)!: remove legacy authentication</text>

<rect x="53" y="650" width="574" height="110" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="73" y="668" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">跨模块同一意图 · 一行 subject，每模块一行正文</text>
<text x="73" y="690" dominant-baseline="central" font-size="12" fill="#3B6D11">feat(common&amp;share&amp;tool): add shared retry</text>
<text x="73" y="708" dominant-baseline="central" font-size="12" fill="#3B6D11">- common: add retry helper</text>
<text x="73" y="726" dominant-baseline="central" font-size="12" fill="#3B6D11">- share: route calls through it</text>
<text x="73" y="744" dominant-baseline="central" font-size="12" fill="#3B6D11">- tool: drop local retry</text>

<rect x="53" y="776" width="574" height="88" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="73" y="794" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Commit mode · hash + subject</text>
<text x="73" y="816" dominant-baseline="central" font-size="12" fill="#185FA5">a1b2c3d  feat(auth): add WeChat QR login</text>
<text x="73" y="834" dominant-baseline="central" font-size="12" fill="#185FA5">e4f5g6h  feat(common&amp;share&amp;tool): add shared retry</text>
<text x="73" y="852" dominant-baseline="central" font-size="12" fill="#185FA5">保留  ?? secrets.md（未提交）</text>
</svg>
