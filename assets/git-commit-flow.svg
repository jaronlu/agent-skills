<svg viewBox="0 0 680 874" width="680" height="874" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>git-commit 的提交决策流程</title>
<desc>从判定 message / commit 模式开始，依次经过 git status porcelain 解读、范围判定 A/B、仓库规则发现、diff 取证、安全检查、原子切分、消息生成，最后输出到消息或提交。常驻的消息契约与安全边界在 SKILL.md，取证与切分步骤见 references/workflow.md。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="874" fill="#FFFFFF"/>

<rect x="190" y="20" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">收到提交请求</text>
<path d="M340 64 L340 80" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="82" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="100" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">① 判定操作模式</text>
<text x="60" y="120" dominant-baseline="central" font-size="12" fill="#5F5E5A">message：只返回消息，不改 Git 状态 · commit：切分并创建原子提交</text>
<path d="M340 134 L340 150" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="152" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="170" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">② git status --short：按 porcelain 两列字面解读</text>
<text x="60" y="190" dominant-baseline="central" font-size="12" fill="#5F5E5A">X = 暂存状态，Y = 工作区状态，?? = 未跟踪；禁止靠改动文件数或 --stat 推断暂存边界</text>
<path d="M340 204 L340 220" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="222" width="600" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="240" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">③ 范围判定（仅 commit mode，message mode 跳过且不改索引）</text>
<text x="60" y="260" dominant-baseline="central" font-size="12" fill="#854F0B">有暂存 + 有未暂存/未跟踪 → 问一次 A/B；无暂存 → 自动全选；只有暂存 → 用暂存</text>
<path d="M340 274 L340 290" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="53" y="292" width="180" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="143" y="310" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">A · 只提交暂存</text>
<text x="143" y="328" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">其余改动一字不动</text>

<rect x="250" y="292" width="180" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="310" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">B · 提交全部</text>
<text x="340" y="328" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">含未暂存与未跟踪</text>

<rect x="447" y="292" width="180" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="537" y="310" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">自动 · 全选 / 仅暂存</text>
<text x="537" y="328" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">仍然强制原子性</text>
<path d="M340 344 L340 360" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="362" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="380" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">④ 低输出发现仓库规则（两种模式都做）</text>
<text x="60" y="400" dominant-baseline="central" font-size="12" fill="#5F5E5A">git ls-files 找 commitlint / hooks / .gitmessage；命中后才读 repository-rules.md</text>
<path d="M340 414 L340 430" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="432" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="450" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑤ 取 diff 证据</text>
<text x="60" y="470" dominant-baseline="central" font-size="12" fill="#5F5E5A">--cached 优先；暂存为空时退回未暂存 + 未跟踪，并在消息里显式说明依据</text>
<text x="60" y="490" dominant-baseline="central" font-size="12" fill="#5F5E5A">无相关改动 → 停止，不产出消息</text>
<path d="M340 504 L340 520" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="522" width="600" height="72" rx="8" fill="#FCE8E8" stroke="#A32D2D" stroke-width="0.5"/>
<text x="60" y="540" dominant-baseline="central" font-size="14" font-weight="500" fill="#822727">⑥ 安全检查：命中即暂停询问，绝不静默处理</text>
<text x="60" y="560" dominant-baseline="central" font-size="12" fill="#A32D2D">冲突标记 / 敏感数据 / 生成噪声 / 纯二进制 / 无关意图 / 破坏性变更</text>
<text x="60" y="580" dominant-baseline="central" font-size="12" fill="#A32D2D">涉密只报告路径与原因，不暴露值；疑似密钥只能排除、修复后复检或留着不提交</text>
<path d="M340 594 L340 610" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="612" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="630" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑦ 按主意图切分原子组</text>
<text x="60" y="650" dominant-baseline="central" font-size="12" fill="#5F5E5A">一个逻辑变更 = 一个提交，可跨多文件；禁止按文件机械拆，也禁止一组混入多个意图</text>
<path d="M340 664 L340 680" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="682" width="600" height="90" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="700" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑧ 每组一条消息</text>
<text x="60" y="720" dominant-baseline="central" font-size="12" fill="#5F5E5A">强制契约 → 兼容仓库规则 → 显式用户指令 → 默认规则</text>
<text x="60" y="738" dominant-baseline="central" font-size="12" fill="#5F5E5A">type(scope): subject，scope 必填且须真实存在；跨模块用 &amp; 连接，如 feat(common&amp;share&amp;tool)</text>
<text x="60" y="756" dominant-baseline="central" font-size="12" fill="#5F5E5A">一次运行内所有 Message 同语种；破坏性变更用 ! 或 BREAKING CHANGE: 脚注</text>
<path d="M340 772 L340 788" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="790" width="290" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="810" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">Message mode</text>
<text x="60" y="828" dominant-baseline="central" font-size="12" fill="#3B6D11">直接返回最佳消息；多组时逐组标注</text>
<text x="60" y="844" dominant-baseline="central" font-size="12" fill="#3B6D11">仅在 why / 影响 / 迁移值得说时才加正文</text>

<rect x="350" y="790" width="290" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="370" y="810" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Commit mode</text>
<text x="370" y="828" dominant-baseline="central" font-size="12" fill="#185FA5">创建原子提交并逐个验证</text>
<text x="370" y="844" dominant-baseline="central" font-size="12" fill="#185FA5">报告 hash + subject + 保留的改动</text>
</svg>
