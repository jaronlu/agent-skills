<svg viewBox="0 0 680 650" width="680" height="650" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>paper-learning 的论文学习流程</title>
<desc>识别论文后检查工作区笔记是否覆盖问题和版本；不足则读取原文并记录来源、版本与证据缺口，按模板更新笔记。结合证据和局限回答，可选 demo 只用于说明机制。用户已请求的外部资料直接核验，未请求的扩展说明边界后停止。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="650" fill="#FFFFFF"/>

<rect x="175" y="20" width="330" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">入口：给论文（arXiv / 链接 / PDF）或提问</text>
<path d="M340 64 L340 80" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="170" y="82" width="340" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="102" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">① 笔记覆盖当前问题和论文版本？</text>
<path d="M340 122 L340 140" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M175 140 L505 140" fill="none" stroke="#888780" stroke-width="1.5"/>
<text x="175" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">否</text>
<text x="505" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">是</text>
<path d="M175 140 L175 158" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M505 140 L505 366" fill="none" stroke="#888780" stroke-width="1.5"/>

<rect x="40" y="160" width="270" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="178" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">② 读取相关原文</text>
<text x="60" y="198" dominant-baseline="central" font-size="12" fill="#185FA5">方法 · 证据 · 局限；标明缺口</text>
<path d="M175 216 L175 232" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="234" width="270" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="252" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">③ 按模板更新笔记</text>
<text x="60" y="272" dominant-baseline="central" font-size="12" fill="#185FA5">来源 / 版本 · 思想 · 证据 · 局限</text>
<path d="M175 290 L175 306" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="308" width="270" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="326" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">写入 papers/&lt;slug&gt;.md</text>
<text x="60" y="346" dominant-baseline="central" font-size="12" fill="#185FA5">或用户指定路径；demo 可选</text>

<path d="M175 364 L175 384 L340 384" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M505 366 L505 384 L340 384" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M340 384 L340 400" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="402" width="600" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="420" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">④ 依据笔记和核验的来源回答</text>
<text x="60" y="440" dominant-baseline="central" font-size="12" fill="#185FA5">结论先行，链接笔记；demo 说明机制，不等于复现结果</text>
<path d="M340 454 L340 470" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="472" width="400" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="492" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">需要用户尚未请求的外部扩展？</text>
<path d="M340 512 L340 528" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M175 528 L505 528" fill="none" stroke="#888780" stroke-width="1.5"/>
<text x="175" y="520" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">是</text>
<text x="505" y="520" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">否</text>
<path d="M175 528 L175 546" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M505 528 L505 546" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="548" width="270" height="76" rx="8" fill="#FCE8E8" stroke="#A32D2D" stroke-width="0.5"/>
<text x="60" y="568" dominant-baseline="central" font-size="14" font-weight="500" fill="#822727">停止：说明范围边界</text>
<text x="60" y="588" dominant-baseline="central" font-size="12" fill="#A32D2D">报告证据缺口，不编造结论</text>
<text x="60" y="608" dominant-baseline="central" font-size="12" fill="#A32D2D">不自行扩展至其他论文</text>

<rect x="370" y="548" width="270" height="76" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="390" y="568" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">出口：交付回答</text>
<text x="390" y="588" dominant-baseline="central" font-size="12" fill="#3B6D11">缺失证据及已请求扩展直接核验</text>
<text x="390" y="608" dominant-baseline="central" font-size="12" fill="#3B6D11">各论文独立笔记；报告未核实项</text>
</svg>
