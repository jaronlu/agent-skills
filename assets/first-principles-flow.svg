<svg viewBox="0 0 680 1200" width="680" height="1200" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>first-principles 的四步分析与现实验证</title>
<desc>判断适用性并通过证据门禁后，分别推导成本或非成本边界。成本按来源与可消除性分解，非成本按指标与限制因素推导。实验检验假设、适用条件或推导步骤；案例数字须核实原始出处。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="1200" fill="#FFFFFF"/>
<rect x="40" y="20" width="600" height="54" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="42" font-size="14" font-weight="500" fill="#2C2C2A">入口：用第一性原理质疑惯例、成本或可能性边界</text>
<path d="M220 74 L220 100" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="100" width="360" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="56" y="122" font-size="14" font-weight="500" fill="#633806">适用？缺少可靠参照 / 怀疑必须如此</text>
<text x="56" y="143" font-size="12" fill="#854F0B">协调、合规、信任问题或只需背书 → 不适用</text>
<path d="M400 132 L436 132" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410" y="122" font-size="12" fill="#5F5E5A">否</text>
<rect x="436" y="100" width="204" height="64" rx="8" fill="#FCE8E8" stroke="#A32D2D" stroke-width="0.5"/>
<text x="452" y="122" font-size="14" font-weight="500" fill="#822727">停止本流程</text>
<text x="452" y="143" font-size="12" fill="#A32D2D">说明原因，改用常规分析</text>
<path d="M220 164 L220 198" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="230" y="186" font-size="12" fill="#5F5E5A">是</text>
<rect x="40" y="198" width="600" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="220" font-size="14" font-weight="500" fill="#0C447C">① 写下共识</text>
<text x="56" y="241" font-size="12" fill="#185FA5">把「一直如此」写成可判断真假的命题，并标明来源</text>
<text x="56" y="259" font-size="12" fill="#185FA5">不可验证的表述先改写为可核对的数字或约束</text>
<path d="M340 268 L340 298" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="298" width="600" height="90" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="320" font-size="14" font-weight="500" fill="#0C447C">② 拆到硬事实</text>
<text x="56" y="341" font-size="12" fill="#185FA5">区分理论约束（模型 / 假设与适用条件）与经验输入（来源、时间、口径、不确定性）</text>
<text x="56" y="359" font-size="12" fill="#185FA5">把事实、假设与适用条件分开；推导步骤须逐项可检查</text>
<text x="56" y="377" font-size="12" fill="#185FA5">关键数字：数值 + 时间点 + 口径 + 来源 + 核实状态</text>
<path d="M340 388 L340 404 L220 404 L220 418" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="418" width="360" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="56" y="440" font-size="14" font-weight="500" fill="#633806">依据是否足以约束关键变量？</text>
<text x="56" y="461" font-size="12" fill="#854F0B">不按条数判断；不以业内常识或惯例充数</text>
<path d="M400 450 L436 450" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410" y="440" font-size="12" fill="#5F5E5A">否</text>
<rect x="436" y="418" width="204" height="64" rx="8" fill="#FCE8E8" stroke="#A32D2D" stroke-width="0.5"/>
<text x="452" y="440" font-size="14" font-weight="500" fill="#822727">暂停定量结论</text>
<text x="452" y="461" font-size="12" fill="#A32D2D">列缺口，改条件式或常规分析</text>
<path d="M220 482 L220 514" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="230" y="504" font-size="12" fill="#5F5E5A">是</text>
<rect x="40" y="514" width="600" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="536" font-size="14" font-weight="500" fill="#0C447C">③ 重建方案并推导边界</text>
<text x="56" y="557" font-size="12" fill="#185FA5">明确目标与约束，选择分支；混合问题分别推导并说明权衡</text>
<path d="M340 578 L340 594 L186 594 L186 610" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 594 L494 594 L494 610" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="610" width="292" height="138" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="632" font-size="14" font-weight="500" fill="#0C447C">成本问题</text>
<text x="56" y="653" font-size="12" fill="#185FA5">C：固定物料方案的零加工基线</text>
<text x="56" y="671" font-size="12" fill="#185FA5">同口径比较 P − C；P ÷ C 仅作启发式</text>
<text x="56" y="689" font-size="12" fill="#185FA5">按科目标注来源与可消除性</text>
<text x="56" y="707" font-size="12" fill="#185FA5">非物理来源也可能是必需成本</text>
<text x="56" y="725" font-size="12" fill="#185FA5">减少条件与验证方式须有依据</text>
<rect x="348" y="610" width="292" height="138" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="364" y="632" font-size="14" font-weight="500" fill="#0C447C">非成本问题</text>
<text x="364" y="653" font-size="12" fill="#185FA5">指标 + 单位 + 基线 + 适用条件</text>
<text x="364" y="671" font-size="12" fill="#185FA5">逐步推导边界或可行性条件</text>
<text x="364" y="689" font-size="12" fill="#185FA5">按限制因素解释与基线的差距</text>
<text x="364" y="707" font-size="12" fill="#185FA5">无法量化：列未知条件与补证方法</text>
<text x="364" y="725" font-size="12" fill="#185FA5">不套用 P、C 或成本差额</text>
<path d="M186 748 L186 766 L220 766 L220 792" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M494 748 L494 766 L220 766" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="792" width="360" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="56" y="814" font-size="14" font-weight="500" fill="#633806">交付需要历史案例或案例数字？</text>
<text x="56" y="835" font-size="12" fill="#854F0B">或需要解释第一性原理、向用户举例</text>
<path d="M400 824 L436 824" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410" y="814" font-size="12" fill="#5F5E5A">是</text>
<rect x="436" y="792" width="204" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="452" y="814" font-size="14" font-weight="500" fill="#2C2C2A">按需读 cases.md</text>
<text x="452" y="835" font-size="12" fill="#5F5E5A">未核实数字须回查原出处</text>
<path d="M220 856 L220 896" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="230" y="879" font-size="12" fill="#5F5E5A">否：直接继续</text>
<path d="M538 856 L538 896" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="896" width="600" height="120" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="918" font-size="14" font-weight="500" fill="#0C447C">④ 回到现实验证</text>
<text x="56" y="939" font-size="12" fill="#185FA5">复核必要成本 / 指标边界 / 可行性条件；材料差额不等于可兑现降本</text>
<text x="56" y="957" font-size="12" fill="#185FA5">选择最短实验，写明预期观测与失败标准</text>
<text x="56" y="975" font-size="12" fill="#185FA5">明确可被推翻的假设、适用条件或推导步骤</text>
<text x="56" y="993" font-size="12" fill="#185FA5">结论失败时事实可仍然成立；证据冲突时重核来源与测量口径</text>
<path d="M340 1016 L340 1046" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="1046" width="600" height="120" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="56" y="1068" font-size="14" font-weight="500" fill="#173404">出口：结论先行，区分事实、估算与本轮推断</text>
<text x="56" y="1089" font-size="12" fill="#3B6D11">一句话结论 → 问题主张与依据 → 边界推导</text>
<text x="56" y="1107" font-size="12" fill="#3B6D11">→ 差距与约束分解 → 未验证部分与残余风险</text>
<text x="56" y="1125" font-size="12" fill="#3B6D11">成本：来源与可消除性分列；非成本：指标与限制因素</text>
<text x="56" y="1143" font-size="12" fill="#3B6D11">未核实数字显式标注；列出验证对象、预期观测和失败标准</text>
</svg>
