<svg viewBox="0 0 680 822" width="680" height="822" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>first-principles 的五步推理流程</title>
<desc>先分类任务模式并定义决策面，再把信息拆成事实、假设、推断、未知，分离真实约束与继承假设，从零重建最简可行方案，最后以决策、判别性检验或成品表达闭环。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="822" fill="#FFFFFF"/>

<rect x="190" y="20" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">复杂决策 / 反复出现的系统性问题</text>
<path d="M340 64 L340 80" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="82" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="100" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">① 定义决策面：目标 · 主成功指标 · 护栏 · 时间窗</text>
<text x="60" y="120" dominant-baseline="central" font-size="12" fill="#5F5E5A">并标明可逆性与出错代价：可逆就带显式假设继续，不可逆必须有证据</text>
<path d="M340 134 L340 150" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="152" width="600" height="100" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="60" y="170" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">任务模式（决定最后交出什么）</text>
<rect x="53" y="184" width="184" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="145" y="202" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Decision · 决策</text>
<text x="145" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">选 / 停 / 继续 / 分配资源</text>
<rect x="249" y="184" width="184" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="341" y="202" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Diagnosis · 诊断</text>
<text x="341" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">定位并检验根因</text>
<rect x="445" y="184" width="184" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="537" y="202" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Communication · 沟通</text>
<text x="537" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">只重构表达，不重开决定</text>
<path d="M340 252 L340 268" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="270" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="288" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">② 建立信息态：事实 / 假设 / 推断 / 未知 分开列</text>
<text x="60" y="308" dominant-baseline="central" font-size="12" fill="#5F5E5A">每个决定性项标注 来源 · 操作定义 · 置信度 · 证伪条件；拿不到就写未知，不编</text>
<text x="60" y="328" dominant-baseline="central" font-size="12" fill="#5F5E5A">最多问 3 个问题，且只在答案会改变结论时问；工作区能查证的先查证</text>
<path d="M340 342 L340 358" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="360" width="600" height="88" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="378" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">③ 拆出真实约束 vs 继承假设</text>
<text x="60" y="398" dominant-baseline="central" font-size="12" fill="#854F0B">真实约束：物理 / 技术 / 经济 / 法律 / 资源 / 时间</text>
<text x="60" y="418" dominant-baseline="central" font-size="12" fill="#854F0B">表象约束归类：事实 / 派生 / 假设 / 惯例 / 类比 / 偏好</text>
<text x="60" y="438" dominant-baseline="central" font-size="12" fill="#854F0B">找出瓶颈，以及「一旦失效整个方案作废」的那条假设；移除前先查依赖或做可逆试验</text>
<path d="M340 448 L340 464" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="466" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="484" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">④ 从零重建：只从 目标 + 事实 + 真实约束 推导最简可行方案</text>
<text x="60" y="504" dominant-baseline="central" font-size="12" fill="#5F5E5A">与现状对比并点名造成差异的继承假设；只在价值 / 成本 / 风险 / 速度 / 可逆性不同时才生成备选</text>
<text x="60" y="522" dominant-baseline="central" font-size="12" fill="#5F5E5A">目标要求量级改进 → 找非线性杠杆并量化 基线 → 目标 → 机制；否则取最高价值的可行动作</text>
<path d="M340 538 L340 554" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="556" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="574" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑤ 收敛：结论先行 + 最可能推翻它的理由</text>
<text x="60" y="594" dominant-baseline="central" font-size="12" fill="#5F5E5A">加载主任务指南 decision / diagnosis / communication；最多再加一本，顺序 诊断 → 决策 → 沟通</text>
<text x="60" y="614" dominant-baseline="central" font-size="12" fill="#5F5E5A">沟通模式下主张无证据支撑或与证据冲突 → 改判为 沟通 → 决策</text>
<path d="M340 628 L340 644" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="646" width="600" height="72" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="664" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">⑥ 闭环产物</text>
<text x="60" y="684" dominant-baseline="central" font-size="12" fill="#185FA5">决策：给出一个选择，或能解决决定性不确定性的最小检验</text>
<text x="60" y="702" dominant-baseline="central" font-size="12" fill="#185FA5">诊断：给出能区分根因的判别性检验 · 沟通：交出以证据为支撑的成品表达</text>
<path d="M340 718 L340 734" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="736" width="600" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="754" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">输出：结论一句话 · 决定性的事实/假设/未知 · 真实约束 vs 可移除假设</text>
<text x="60" y="774" dominant-baseline="central" font-size="12" fill="#3B6D11">重建方案 · 杠杆判断 · 主失效条件 · 闭环动作；没用的小节直接删掉</text>
</svg>
