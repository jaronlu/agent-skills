<svg viewBox="0 0 680 920" width="680" height="920" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>hermes-context-review 的上下文审查流程</title>
<desc>先解析审查目标，再依次检查归属层级、内容一致性、记忆格式契约与上下文效率，按 P0/P1/P2 分级，最后输出唯一一行 VERDICT。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="920" fill="#FFFFFF"/>

<rect x="190" y="20" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Hermes 长期上下文审查请求</text>
<path d="M340 64 L340 80" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="82" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="100" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">① 解析目标：显式 home → $HERMES_HOME → ~/.hermes</text>
<text x="60" y="120" dominant-baseline="central" font-size="12" fill="#5F5E5A">Home：SOUL.md / AGENTS.md / memories/*.md / references/*.md / config.yaml（不暴露密钥）</text>
<text x="60" y="140" dominant-baseline="central" font-size="12" fill="#5F5E5A">项目：AGENTS.md、AGENTS.override.md、.hermes.md、CLAUDE.md、.cursorrules；以 index 为准</text>
<path d="M340 154 L340 170" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="172" width="600" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="192" dominant-baseline="central" font-size="13" fill="#633806">没有任何可审上下文 → 停止并报告，不输出 VERDICT</text>
<path d="M340 212 L340 228" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="230" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="248" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">② 完整读取每个目标，并解析其中的路径、章节引用、技能名与配置声明</text>
<text x="60" y="268" dominant-baseline="central" font-size="12" fill="#5F5E5A">只读不改：不编辑文件、不暂存提交、不改配置、不建定时任务</text>
<path d="M340 282 L340 298" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="300" width="600" height="100" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="60" y="318" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">③ 归属检查：规则放错层本身就是发现项</text>
<rect x="53" y="332" width="136" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="121" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">SOUL.md</text>
<text x="121" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">全局人格与常驻行为</text>
<rect x="199" y="332" width="136" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="267" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">AGENTS.md</text>
<text x="267" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">单项目指令</text>
<rect x="345" y="332" width="136" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="413" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">memories/</text>
<text x="413" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">紧凑偏好与环境事实</text>
<rect x="491" y="332" width="136" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="559" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">references/</text>
<text x="559" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">按需加载的方法</text>
<path d="M340 400 L340 416" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="418" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="436" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">④ 内容检查：重复 · 冲突 · 过期 · 不可验证 · 过宽 · 不安全</text>
<text x="60" y="456" dominant-baseline="central" font-size="12" fill="#5F5E5A">优先保留唯一权威规则；config.yaml 的声明要与实际文件交叉核对</text>
<text x="60" y="476" dominant-baseline="central" font-size="12" fill="#5F5E5A">home 级 AGENTS.md 不会被自动加载 → 标出「假装在全局生效」的规则</text>
<path d="M340 490 L340 506" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="508" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="526" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑤ 记忆格式契约：一条一个 § 分隔行</text>
<text x="60" y="546" dominant-baseline="central" font-size="12" fill="#5F5E5A">分隔符破损、存储达到或超出字符上限、与 SOUL.md 或项目上下文重复的条目 → 全部记为发现</text>
<text x="60" y="566" dominant-baseline="central" font-size="12" fill="#5F5E5A">查不到就以「未验证」标注，不猜</text>
<path d="M340 580 L340 596" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="598" width="600" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="616" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑥ 上下文效率：低频细节移出常驻区</text>
<text x="60" y="636" dominant-baseline="central" font-size="12" fill="#5F5E5A">移入 references/、按需技能或 session_search；合并无独立行为效果的重复表述</text>
<text x="60" y="656" dominant-baseline="central" font-size="12" fill="#5F5E5A">SOUL.md / AGENTS.md 过长会被静默截断 → 标出有掉出风险的章节，但不删有意义约束</text>
<path d="M340 670 L340 686" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="688" width="600" height="118" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="60" y="706" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑦ 分级：每条发现都要给 文件 + 精确位置 + 证据 + 影响 + 最小修正</text>
<rect x="53" y="720" width="184" height="72" rx="8" fill="#FCE8E8" stroke="#A32D2D" stroke-width="0.5"/>
<text x="145" y="738" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#822727">P0</text>
<text x="145" y="758" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">权限错乱 / 安全风险</text>
<text x="145" y="774" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">引用失效 / 格式违规</text>
<rect x="249" y="720" width="184" height="72" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="341" y="738" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">P1</text>
<text x="341" y="758" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">冲突 / 过期 / 重复</text>
<text x="341" y="774" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">/ 放错层（有维护成本）</text>
<rect x="445" y="720" width="184" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="537" y="738" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">P2</text>
<text x="537" y="758" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">不改变行为的</text>
<text x="537" y="774" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">清晰度 / 压缩建议</text>
<path d="M340 806 L340 822" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="824" width="600" height="72" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="842" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">输出：先给整体结论，再按严重度列发现；无发现的维度显式写「已检查，无发现」</text>
<text x="60" y="862" dominant-baseline="central" font-size="12" fill="#3B6D11">结尾只有一行：VERDICT: BLOCK（有 P0） / WARN（有 P1） / PASS</text>
<text x="60" y="882" dominant-baseline="central" font-size="12" fill="#3B6D11">用请求所用语言撰写；措辞偏好不算发现</text>
</svg>
