<svg viewBox="0 0 680 940" width="680" height="940" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>design-convergence-review 的六维收敛评审流程</title>
<desc>从设计输入抽取要素，建立最小追溯链，扫描闭合性、完整性、冗余、范围漂移、一致性、可演进性六维，再定严重度、Verdict 与分数，最后输出报告。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="940" fill="#FFFFFF"/>

<rect x="175" y="20" width="330" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">设计评审输入：正文 / 文档 / 文件集 / 文件夹</text>
<path d="M340 64 L340 80" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="82" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="100" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">① 抽取要素：目标 / 范围 / 约束 / 职责 / 主流程 / 失败流 / 终态 / 验证方式</text>
<text x="60" y="120" dominant-baseline="central" font-size="12" fill="#5F5E5A">无输入，或目标里没有可评审的设计内容（只有代码、日志、会议记录）→ 停止并报告</text>
<path d="M340 134 L340 150" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="152" width="600" height="100" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="60" y="170" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">② 最小追溯链（无需求则从目标起，不宣称需求覆盖）</text>
<rect x="55" y="184" width="132" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="121" y="202" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">需求 / 目标</text>
<text x="121" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">要满足什么</text>
<path d="M187 210 L197 210" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="201" y="184" width="132" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="267" y="202" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">设计决策</text>
<text x="267" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">怎么满足</text>
<path d="M333 210 L343 210" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="347" y="184" width="132" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="413" y="202" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">实现责任</text>
<text x="413" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">谁来做</text>
<path d="M479 210 L489 210" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="493" y="184" width="132" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="559" y="202" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">验证方法</text>
<text x="559" y="220" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">怎么证明做成</text>
<path d="M340 252 L340 268" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="270" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="288" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">③ 记录每个环节由哪个文件定义</text>
<text x="60" y="308" dominant-baseline="central" font-size="12" fill="#5F5E5A">多文档集还要定位孤儿文档与唯一事实源；文件夹评审先读 references/folder-review.md</text>
<path d="M340 322 L340 338" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="340" width="600" height="146" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="60" y="358" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">④ 六维收敛扫描：只留证据支持的发现与真实证据缺口</text>

<rect x="53" y="374" width="185" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="145" y="390" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Closure · 闭合性</text>
<text x="145" y="408" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">流程有入口、出口、终态</text>

<rect x="248" y="374" width="185" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="390" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Completeness · 完整性</text>
<text x="340" y="408" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">TODO / 边界 / 回滚不缺</text>

<rect x="443" y="374" width="185" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="535" y="390" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Redundancy · 冗余</text>
<text x="535" y="408" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">重复定义会漂移</text>

<rect x="53" y="430" width="185" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="145" y="446" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Scope Drift · 范围漂移</text>
<text x="145" y="464" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">教程与远景混入当前设计</text>

<rect x="248" y="430" width="185" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="446" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Consistency · 一致性</text>
<text x="340" y="464" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">术语、状态、版本互相打架</text>

<rect x="443" y="430" width="185" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="535" y="446" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Evolvability · 演进性</text>
<text x="535" y="464" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">扩展点是否有契约</text>
<path d="M340 486 L340 502" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="504" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="522" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑤ 合并同源根因：按最高影响维度归一次，先定严重度，再定判定与分数</text>
<text x="60" y="542" dominant-baseline="central" font-size="12" fill="#5F5E5A">不报措辞、排版、代码风格、个人偏好与可选优化</text>
<path d="M340 556 L340 572" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="574" width="600" height="100" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="60" y="592" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑥ 严重度分级</text>
<rect x="53" y="606" width="136" height="52" rx="8" fill="#FCE8E8" stroke="#A32D2D" stroke-width="0.5"/>
<text x="121" y="624" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#822727">Blocking 阻塞</text>
<text x="121" y="642" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">核心流无法实现或验证</text>
<rect x="199" y="606" width="136" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="267" y="624" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Warning 警告</text>
<text x="267" y="642" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">重要歧义或局部缺失</text>
<rect x="345" y="606" width="136" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="413" y="624" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">无法判断·阻断</text>
<text x="413" y="642" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">缺口会改变可否落地</text>
<rect x="491" y="606" width="136" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="559" y="624" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">无法判断·不阻断</text>
<text x="559" y="642" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">仅限制外部比较</text>
<path d="M340 674 L340 690" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="692" width="600" height="100" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="60" y="710" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑦ Verdict：按优先级取唯一一个</text>
<rect x="53" y="724" width="184" height="52" rx="8" fill="#FCE8E8" stroke="#A32D2D" stroke-width="0.5"/>
<text x="145" y="742" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#822727">① 需修订</text>
<text x="145" y="760" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">存在阻塞或警告</text>
<rect x="249" y="724" width="184" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="341" y="742" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">② 证据不足</text>
<text x="341" y="760" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">无阻塞警告但有阻断缺口</text>
<rect x="445" y="724" width="184" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="537" y="742" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">③ 收敛</text>
<text x="537" y="760" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">三者皆无</text>
<path d="M340 792 L340 808" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="810" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="828" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">⑧ Score：100 起 · 阻塞 −25 · 警告 −6 · 阻断性缺口 −10 · 同源只记一次 · 下限 0</text>
<text x="60" y="848" dominant-baseline="central" font-size="12" fill="#5F5E5A">分数只表达距离收敛的远近，永远不能推翻 Verdict</text>
<path d="M340 862 L340 878" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="880" width="600" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="898" dominant-baseline="central" font-size="14" font-weight="500" fill="#173404">输出：先给 Verdict，再按严重度列出发现</text>
<text x="60" y="918" dominant-baseline="central" font-size="12" fill="#3B6D11">每条给出 位置 / 维度 / 严重度 / 问题 / 最小动作；只做收敛，不重做架构</text>
</svg>
