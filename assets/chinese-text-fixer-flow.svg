<svg viewBox="0 0 680 600" width="680" height="600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
<title>chinese-text-fixer 的两类确定性修复流程</title>
<desc>检查用户指定的中文文本，仅修复反向闭合的中文双引号和误放在 Markdown 加粗范围内的句末标点；引号配对不明确时报告并停止；未明确授权写回时只输出差异；涉及 2 个及以上文件时先列清单等待确认。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="600" fill="#FFFFFF"/>
<rect x="40" y="20" width="600" height="62" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="45" font-size="14" font-weight="500" fill="#2C2C2A">入口：用户要求修复中文文本</text>
<text x="56" y="66" font-size="12" fill="#5F5E5A">仅检查指定文本或文件范围</text>
<path d="M340 82 L340 106" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="106" width="600" height="94" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="130" font-size="14" font-weight="500" fill="#0C447C">① 检查两类确定性错误</text>
<text x="56" y="153" font-size="12" fill="#185FA5">“我答应你“ → “我答应你”</text>
<text x="56" y="177" font-size="12" fill="#185FA5">**句子。** → **句子**。</text>
<path d="M340 200 L340 226" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="226" width="600" height="74" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="56" y="251" font-size="14" font-weight="500" fill="#633806">② 引号归属是否明确？</text>
<text x="56" y="276" font-size="12" fill="#854F0B">不明确：指出位置并停止；不补引号、不猜测</text>
<path d="M340 300 L340 326" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="326" width="600" height="74" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="56" y="351" font-size="14" font-weight="500" fill="#633806">③ 用户是否明确要求写回？</text>
<text x="56" y="376" font-size="12" fill="#854F0B">否（仅检查或诊断）：只输出修复前后差异并停止；是：继续</text>
<path d="M340 400 L340 426" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="426" width="600" height="74" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="56" y="451" font-size="14" font-weight="500" fill="#633806">④ 涉及 2 个及以上文件？</text>
<text x="56" y="476" font-size="12" fill="#854F0B">是：先列出文件与修复数，等用户确认；否：写回后重读核对</text>
<path d="M340 500 L340 526" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="526" width="600" height="50" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="56" y="556" font-size="14" font-weight="500" fill="#173404">出口：交付修复结果；其他内容保持原样</text>
</svg>
